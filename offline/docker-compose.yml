version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: offline/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
